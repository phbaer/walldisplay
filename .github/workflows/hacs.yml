name: HACS integration
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to package (for example a PR head SHA)"
        required: true
        type: string
      tag:
        description: "Release tag to publish (for example v1.0.0 or v1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      # Pin around the current main-branch manifest-discovery regression.
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Topics are GitHub settings; license metadata is also GitHub-indexed
          # and can lag behind a newly committed root LICENSE file.
          ignore: brands images license topics
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: firmware-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      - run: zip -r walldisplay_sync.zip custom_components/walldisplay_sync
      - name: Create GitHub integration release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ inputs.ref || github.sha }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET" --title "WallDisplay Sync $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* || "$RELEASE_TAG" == *b* ]]; then
              args+=(--prerelease)
            else
              # Stable vMAJOR.MINOR.PATCH tags are the latest normal release.
              args+=(--latest)
            fi
            "${args[@]}"
          fi
          # GitHub releases may be created by another workflow or a prior run.
          # Upload only the integration asset; never rewrite the release target.
          gh release upload "$RELEASE_TAG" walldisplay_sync.zip --clobber
