name: HACS branch preview

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  package:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      - run: zip -r walldisplay_sync.zip custom_components/walldisplay_sync
      - uses: actions/upload-artifact@v7
        with:
          name: walldisplay-sync-preview
          path: walldisplay_sync.zip
          if-no-files-found: error
          retention-days: 14
