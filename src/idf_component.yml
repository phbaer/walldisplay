  espressif/esp_lvgl_port:
    version: "^2.8.0"
  espressif/esp_lcd_st7701:
    version: "^2.0.2"
  espressif/esp_lcd_panel_io_additions:
    version: "^1.0.1"
  espressif/esp_lcd_touch:
    version: "^1.2.1"
  espressif/esp_lcd_touch_gt911:
    version: "^1.2.0"
  espressif/mqtt:
    version: "^1.0.0"
  espressif/cjson:
    version: "^1.7.19"
  joltwallet/littlefs:
    version: "1.22.3"
