name: Firmware builds and releases

# Keep this equal to Forgejo's externally reachable canonical URL. The runner's
# forgejo.server_url may be an internal Docker hostname in container setups.
env:
  PUBLIC_URL: ${{ vars.PUBLIC_URL }}

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag; empty builds artifacts only
        required: false
        type: string

jobs:
  build:
    if: ${{ !((forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')) || (forgejo.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: node
    container:
      image: espressif/idf:v6.0.3
    defaults:
      run:
        shell: bash
    steps:
      - name: Install action runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust checkout in build container
        env:
          CHECKOUT_WORKSPACE: ${{ forgejo.workspace }}
        run: git config --global --add safe.directory "$CHECKOUT_WORKSPACE"
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      - name: Select version and verify source
        id: release
        run: |
          tag=""
          python tools/firmware_release.py select --tag "$tag" --output "$FORGEJO_OUTPUT"
      - name: Build and verify unsigned test firmware
        run: bash tools/ci_firmware.sh build
      - name: Package firmware
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          source "${IDF_PATH:?}/export.sh"
          python tools/firmware_release.py package --version "$VERSION" --server "$SERVER" --repo "$REPOSITORY"
      - name: Upload build artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: firmware-${{ steps.release.outputs.version }}-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ (forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')) || (forgejo.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: node
    concurrency:
      group: firmware-release-${{ inputs.release_tag || forgejo.ref_name }}
      cancel-in-progress: false
    container:
      image: espressif/idf:v6.0.3
    defaults:
      run:
        shell: bash
    steps:
      - name: Install action runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || forgejo.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust checkout in build container
        env:
          CHECKOUT_WORKSPACE: ${{ forgejo.workspace }}
        run: git config --global --add safe.directory "$CHECKOUT_WORKSPACE"
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      - name: Select version and verify source
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ forgejo.ref }}
        run: |
          tag="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
          python tools/firmware_release.py select --tag "$tag" --output "$FORGEJO_OUTPUT"
      - name: Validate Forgejo public URL
        env:
          SERVER: ${{ env.PUBLIC_URL }}
        run: test -n "$SERVER" || { echo 'PUBLIC_URL is missing from the workflow' >&2; exit 1; }
      - name: Build and verify signed release
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          FIRMWARE_VERSION: ${{ steps.release.outputs.version }}
        run: bash tools/ci_firmware.sh release
      - name: Package firmware
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          source "${IDF_PATH:?}/export.sh"
          python tools/firmware_release.py package --version "$VERSION" --server "$SERVER" --repo "$REPOSITORY"
      - name: Generate release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv curl jq
          python3 -m venv /tmp/git-cliff-venv
          /tmp/git-cliff-venv/bin/pip install --no-cache-dir git-cliff==2.13.1
          /tmp/git-cliff-venv/bin/git-cliff --tag "$VERSION" --output dist/CHANGELOG.md
          /tmp/git-cliff-venv/bin/git-cliff --latest --strip all > release-notes.md
      - name: Upload build artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: firmware-${{ steps.release.outputs.version }}-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish Forgejo release
        env:
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          RELEASE_TOKEN: ${{ forgejo.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=(python tools/publish_forgejo_release.py --server "$SERVER" --repo "$REPOSITORY" --token "$RELEASE_TOKEN" --tag "$VERSION" --title "Wall Display $VERSION" --notes-file release-notes.md --release-dir dist)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          "${args[@]}"
      - name: Publish stable changelog to Forgejo wiki
        if: steps.release.outputs.prerelease == 'false'
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w 0)"
          git -c "http.extraHeader=AUTHORIZATION: basic $AUTH" clone "${SERVER}/${REPOSITORY}.wiki.git" wiki
          cp dist/CHANGELOG.md wiki/Changelog.md
          git -C wiki add Changelog.md
          if git -C wiki diff --cached --quiet; then exit 0; fi
          git -C wiki config user.name 'Forgejo Actions'
          git -C wiki config user.email 'actions@forgejo.local'
          git -C wiki commit -m "docs: update changelog for ${VERSION} [skip ci]"
          git -C wiki -c "http.extraHeader=AUTHORIZATION: basic $AUTH" push origin HEAD
