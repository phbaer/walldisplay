name: Firmware builds and releases

# Keep this equal to Forgejo's externally reachable canonical URL. The runner's
# forgejo.server_url may be an internal Docker hostname in container setups.
env:
  PUBLIC_URL: ${{ vars.PUBLIC_URL }}

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag; empty builds artifacts only
        required: false
        type: string

jobs:
  build:
    if: ${{ !((forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')) || (forgejo.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: node
    container:
      image: espressif/idf:v6.1.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Install action runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust checkout in build container
        env:
          CHECKOUT_WORKSPACE: ${{ forgejo.workspace }}
        run: git config --global --add safe.directory "$CHECKOUT_WORKSPACE"
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      - name: Select version and verify source
        id: release
        run: |
          tag=""
          python tools/firmware_release.py select --tag "$tag" --output "$FORGEJO_OUTPUT"
      - name: Build and verify unsigned test firmware
        run: bash tools/ci_firmware.sh build
      - name: Package firmware
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          source "${IDF_PATH:?}/export.sh"
          python tools/firmware_release.py package --version "$VERSION" --server "$SERVER" --repo "$REPOSITORY"
      - name: Upload build artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: firmware-${{ steps.release.outputs.version }}-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  preview-build:
    if: ${{ forgejo.event_name == 'pull_request' && (forgejo.event.action == 'labeled' || forgejo.event.action == 'label_updated') && forgejo.event.label.name == 'firmware-preview' && contains(forgejo.event.pull_request.labels.*.name, 'firmware-preview') && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    runs-on: node
    container:
      image: espressif/idf:v6.1.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Install action runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs curl
      - name: Resolve same-repository PR head
        id: source
        env:
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          PR_NUMBER: ${{ forgejo.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          server = os.environ["SERVER"].rstrip("/")
          repo = os.environ["REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          request = urllib.request.Request(
              f"{server}/api/v1/repos/{repo}/pulls/{number}",
              headers={"Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              pr = json.load(response)
          if pr.get("state") != "open":
              raise SystemExit("A signed firmware preview requires an open PR")
          head = pr.get("head") or {}
          head_repo = head.get("repo") or {}
          if head_repo.get("full_name") != repo:
              raise SystemExit("Signed previews are limited to branches in this repository")
          sha = head.get("sha", "")
          if len(sha) != 40 or any(char not in "0123456789abcdef" for char in sha):
              raise SystemExit("Forgejo returned an invalid PR head SHA")
          with open(os.environ["FORGEJO_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: Trust source checkout in build container
        env:
          SOURCE_WORKSPACE: ${{ forgejo.workspace }}/source
        run: git config --global --add safe.directory "$SOURCE_WORKSPACE"
      - name: Select signed preview version
        id: package
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ forgejo.event.pull_request.number }}
          RUN_ID: ${{ forgejo.run_id }}
          RUN_ATTEMPT: ${{ forgejo.run_attempt }}
        run: |
          python tools/sync_project_version.py --check
          readarray -t values < <(python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          tag = f"v{version}-pr.{os.environ['PR_NUMBER']}.{os.environ['RUN_ID']}.{os.environ['RUN_ATTEMPT']}"
          if len(tag) > 32 or any(char not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.+-" for char in tag):
              raise SystemExit("The generated preview version is not valid for firmware")
          print(tag)
          print(tag.removeprefix("v"))
          PY
          )
          test "${#values[@]}" -eq 2
          printf 'tag=%s\nversion=%s\n' "${values[0]}" "${values[1]}" >> "$FORGEJO_OUTPUT"
          source "${IDF_PATH:?}/export.sh"
          python tools/build_preview_firmware.py --version "${values[0]}" --build-dir build-preview
      - name: Collect unsigned OTA image and matching factory files
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PREVIEW_TAG: ${{ steps.package.outputs.tag }}
          PREVIEW_VERSION: ${{ steps.package.outputs.version }}
          PR_NUMBER: ${{ forgejo.event.pull_request.number }}
          RUN_ID: ${{ forgejo.run_id }}
          RUN_ATTEMPT: ${{ forgejo.run_attempt }}
        run: |
          mkdir -p preview-input
          cp build-preview/walldisplay.bin preview-input/walldisplay-unsigned.bin
          cp build-preview/bootloader/bootloader.bin preview-input/bootloader.bin
          cp build-preview/partition_table/partition-table.bin preview-input/partition-table.bin
          cp build-preview/ota_data_initial.bin preview-input/ota_data_initial.bin
          cp partitions.csv preview-input/partitions.csv
          printf '%s\n' "$SOURCE_SHA" > preview-input/source-sha.txt
          python - <<'PY'
          import json, os
          metadata = {
              "source_sha": os.environ["SOURCE_SHA"],
              "tag": os.environ["PREVIEW_TAG"],
              "version": os.environ["PREVIEW_VERSION"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
          }
          with open("preview-input/preview.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output)
              output.write("\n")
          PY
      - name: Upload unsigned preview inputs
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: ota-preview-input-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          path: source/preview-input/*
          if-no-files-found: error
          retention-days: 2

  release:
    if: ${{ (forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')) || (forgejo.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: node
    concurrency:
      group: firmware-release-${{ inputs.release_tag || forgejo.ref_name }}
      cancel-in-progress: false
    container:
      image: espressif/idf:v6.1.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Install action runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || forgejo.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust checkout in build container
        env:
          CHECKOUT_WORKSPACE: ${{ forgejo.workspace }}
        run: git config --global --add safe.directory "$CHECKOUT_WORKSPACE"
      - name: Synchronize project version
        run: python tools/sync_project_version.py --check
      - name: Select version and verify source
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ forgejo.ref }}
          DEFAULT_BRANCH: ${{ forgejo.event.repository.default_branch }}
        run: |
          tag="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "Firmware release tags must point to a commit on $DEFAULT_BRANCH" >&2
            exit 1
          }
          python tools/firmware_release.py select --tag "$tag" --output "$FORGEJO_OUTPUT"
      - name: Validate Forgejo public URL
        env:
          SERVER: ${{ env.PUBLIC_URL }}
        run: test -n "$SERVER" || { echo 'PUBLIC_URL is missing from the workflow' >&2; exit 1; }
      - name: Build and verify signed release
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          FIRMWARE_VERSION: ${{ steps.release.outputs.version }}
        run: bash tools/ci_firmware.sh release
      - name: Package firmware
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          source "${IDF_PATH:?}/export.sh"
          python tools/firmware_release.py package --version "$VERSION" --server "$SERVER" --repo "$REPOSITORY"
      - name: Generate release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv curl jq
          python3 -m venv /tmp/git-cliff-venv
          /tmp/git-cliff-venv/bin/pip install --no-cache-dir git-cliff==2.13.1
          /tmp/git-cliff-venv/bin/git-cliff --tag "$VERSION" --output dist/CHANGELOG.md
          /tmp/git-cliff-venv/bin/git-cliff --latest --strip all > release-notes.md
      - name: Upload build artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: firmware-${{ steps.release.outputs.version }}-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish Forgejo release
        env:
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          RELEASE_TOKEN: ${{ forgejo.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=(python tools/publish_forgejo_release.py --server "$SERVER" --repo "$REPOSITORY" --token "$RELEASE_TOKEN" --tag "$VERSION" --title "Wall Display $VERSION" --notes-file release-notes.md --release-dir dist)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          "${args[@]}"
      - name: Publish stable changelog to Forgejo wiki
        if: steps.release.outputs.prerelease == 'false'
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
          SERVER: ${{ env.PUBLIC_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w 0)"
          git -c "http.extraHeader=AUTHORIZATION: basic $AUTH" clone "${SERVER}/${REPOSITORY}.wiki.git" wiki
          cp dist/CHANGELOG.md wiki/Changelog.md
          git -C wiki add Changelog.md
          if git -C wiki diff --cached --quiet; then exit 0; fi
          git -C wiki config user.name 'Forgejo Actions'
          git -C wiki config user.email 'actions@forgejo.local'
          git -C wiki commit -m "docs: update changelog for ${VERSION} [skip ci]"
          git -C wiki -c "http.extraHeader=AUTHORIZATION: basic $AUTH" push origin HEAD
