wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

mqtt:
  uri: "mqtt://homeassistant.local:1883"
  username: "mqtt-user"
  password: "mqtt-password"

homeassistant:
  discovery_prefix: "homeassistant"
  base_topic: "panel/guition-4848s040"
  enable_discovery: true

# Initial layout; persisted runtime settings and Home Assistant updates take precedence.
display:
  page1: weather
  page2: media
  page3: none
  default_page: weather
  weather_title: Weather
  media_title: Media
  buttons_title: Buttons
